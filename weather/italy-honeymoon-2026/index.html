<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>意大利蜜月天气</title><style>
:root{--b:#fff;--p:#f7f7f5;--p2:#ededeb;--t:#252525;--m:#73736f;--l:#deded9;--r:#367fcf;--h:#d8792d;--c:#4f83cc}@media(prefers-color-scheme:dark){:root{--b:#191919;--p:#242424;--p2:#303030;--t:#eee;--m:#aaa;--l:#3b3b3b;--r:#70abef;--h:#f2a45d;--c:#77a8e8}}*{box-sizing:border-box}html,body{margin:0;background:var(--b);color:var(--t);font:11px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;overflow:hidden}body{padding:7px}.app{transform-origin:0 0}.head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}.title{font-size:15px;font-weight:750}.sub,.muted{color:var(--m)}.sub{font-size:9px;margin-top:1px}.right{display:flex;align-items:center;gap:6px}.btn{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--l);border-radius:6px;padding:4px 7px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:6px}.metric,.card,.summary,.pack,.strip{border:1px solid var(--l);background:var(--p);border-radius:8px}.metric{padding:6px}.metric b{font-size:16px;display:block;margin:1px 0}.strip{display:grid;grid-template-columns:repeat(11,1fr);gap:0;overflow:hidden}.day{padding:5px 2px;text-align:center;border-right:1px solid var(--l);min-width:0}.day:last-child{border:0}.date{font-size:8px;color:var(--m)}.icon{font-size:18px;line-height:1.1}.temp{font-weight:700;font-size:10px;white-space:nowrap}.rain{font-size:8px;color:var(--r)}.place{font-size:7px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pack{padding:6px;margin-top:6px}.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.chip{background:var(--p2);border-radius:999px;padding:3px 6px;font-size:8px;white-space:nowrap}.summary{padding:6px 8px;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}.summary h2{font-size:12px;margin:0 0 2px}.badge{border:1px solid var(--l);border-radius:999px;padding:2px 5px;font-size:8px;height:max-content}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.card{padding:6px;min-width:0}.ct{display:flex;justify-content:space-between;gap:5px}.name{font-weight:700;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.elev{font-size:7px;color:var(--m)}.big{font-size:18px;font-weight:750;margin:4px 0}.low{font-size:11px;color:var(--m)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:3px}.fact{background:var(--b);border-radius:5px;padding:3px 4px}.fk{font-size:7px;color:var(--m)}.fv{font-size:8px;font-weight:650;white-space:nowrap}.note{font-size:7px;color:var(--m);margin-top:4px;padding-top:3px;border-top:1px solid var(--l);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.foot{font-size:7px;color:var(--m);display:flex;justify-content:space-between;margin-top:4px}.notice{padding:10px;border:1px solid var(--l);background:var(--p);border-radius:8px}@media(max-width:520px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.strip{grid-template-columns:repeat(6,1fr);overflow:auto}}
</style></head><body><div class="app" id="app"><div class="head"><div><div class="title" id="title">意大利蜜月天气</div><div class="sub" id="sub">Open-Meteo 16 天 · °C · m/s · mm</div></div><div class="right"><span class="muted" id="status">加载中…</span><button class="btn" id="refresh">刷新</button></div></div><div id="root"><div class="notice">正在获取天气预报…</div></div><div class="foot"><span>数据：Open-Meteo · 山区天气变化快</span><span id="updated"></span></div></div><script>
const P={sea:['Seattle / SEA',47.4502,-122.3088,132,'city'],muc:['Munich Airport',48.3538,11.7861,448,'city'],ort:['Ortisei',46.5743,11.6711,1236,'valley'],sec:['Seceda',46.6002,11.7240,2519,'mountain'],alp:['Alpe di Siusi',46.5408,11.6154,1850,'mountain'],pue:['Puez–Odle',46.6027,11.8270,2400,'mountain'],mal:['Malcesine',45.7655,10.8081,90,'lake'],bal:['Monte Baldo',45.7837,10.8522,1760,'mountain'],lim:['Limone sul Garda',45.8147,10.7928,69,'lake'],riv:['Riva del Garda',45.8892,10.8431,70,'lake'],mil:['Milan',45.4642,9.1900,122,'city'],mxp:['Milan Malpensa',45.6301,8.7231,234,'city'],lhr:['London Heathrow',51.47,-.4543,25,'city']};
const R={'2026-09-03':['9 月 3 日（周四）','Seattle 出发','sea',['sea']],'2026-09-04':['9 月 4 日（周五）','Munich → Ortisei','ort',['muc','ort']],'2026-09-05':['9 月 5 日（周六）','Seceda / Val Gardena','sec',['ort','sec']],'2026-09-06':['9 月 6 日（周日）','Alpe di Siusi','alp',['ort','alp']],'2026-09-07':['9 月 7 日（周一）','Dolomites 弹性徒步日','pue',['ort','pue']],'2026-09-08':['9 月 8 日（周二）','Ortisei → Malcesine','mal',['ort','mal']],'2026-09-09':['9 月 9 日（周三）','Monte Baldo / Malcesine','bal',['mal','bal']],'2026-09-10':['9 月 10 日（周四）','Lake Garda 渡轮日','mal',['mal','lim','riv']],'2026-09-11':['9 月 11 日（周五）','Malcesine → Milan','mil',['mal','mil']],'2026-09-12':['9 月 12 日（周六）','Milan 市区','mil',['mil']],'2026-09-13':['9 月 13 日（周日）','MXP → LHR → SEA','mxp',['mxp','lhr']]};
const vars='weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,uv_index_max',$=s=>document.querySelector(s),f=(n,d=0)=>Number.isFinite(+n)?(+n).toFixed(d):'—',e=s=>String(s).replace(/[&<>\"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[x]));
function wi(c){c=+c;if(c===0)return['☀️','晴'];if([1,2].includes(c))return['🌤️','多云'];if(c===3)return['☁️','阴'];if([45,48].includes(c))return['🌫️','雾'];if([51,53,55,56,57,61,63,65,66,67].includes(c))return['🌧️','雨'];if([71,73,75,77,85,86].includes(c))return['🌨️','雪'];if([80,81,82].includes(c))return['🌦️','阵雨'];if([95,96,99].includes(c))return['⛈️','雷暴'];return['🌡️','变化'];}
function url(id){let p=P[id],q=new URLSearchParams({latitude:p[1],longitude:p[2],elevation:p[3],daily:vars,temperature_unit:'celsius',wind_speed_unit:'ms',precipitation_unit:'mm',timezone:'auto',forecast_days:'16'});return'https://api.open-meteo.com/v1/forecast?'+q}
async function load(id){let r=await fetch(url(id),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function x(d,date){let i=d?.daily?.time?.indexOf(date);if(i<0||i==null)return null;let a=d.daily;return{code:a.weather_code[i],hi:a.temperature_2m_max[i],lo:a.temperature_2m_min[i],ahi:a.apparent_temperature_max[i],alo:a.apparent_temperature_min[i],mm:a.precipitation_sum[i],rp:a.precipitation_probability_max[i],w:a.wind_speed_10m_max[i],g:a.wind_gusts_10m_max[i],uv:a.uv_index_max[i]}}
function conf(date){let now=new Date(),rome=new Date(now.toLocaleString('en-US',{timeZone:'Europe/Rome'})),d=Math.round((Date.parse(date+'T12:00:00Z')-Date.UTC(rome.getFullYear(),rome.getMonth(),rome.getDate(),12))/864e5);return d<=5?'较高':d<=10?'中等':'长期趋势'}
function tips(rows){let a=rows.map(r=>r.w).filter(Boolean);if(!a.length)return['日期进入未来 16 天后自动显示'];let lo=Math.min(...a.map(v=>v.lo)),hi=Math.max(...a.map(v=>v.hi)),rp=Math.max(...a.map(v=>v.rp||0)),g=Math.max(...a.map(v=>v.g||0)),uv=Math.max(...a.map(v=>v.uv||0)),t=['分层穿衣'];if(lo<=3)t.push('保暖层＋帽子/手套');else if(lo<=10)t.push('薄抓绒/外套');if(hi>=27)t.push('轻薄衣物');if(rp>=35)t.push('防水外套/折叠伞');if(g>=12)t.push('防风层');if(uv>=5)t.push('防晒霜＋太阳镜');if(rows.some(r=>P[r.id][4]==='mountain'))t.push('高海拔温差装备');if(rows.some(r=>['mountain','lake','valley'].includes(P[r.id][4])))t.push('防滑徒步鞋');return[...new Set(t)]}
function note(id,w){let k=P[id][4],a=[];if(k==='mountain')a.push('高海拔温差/阵风变化快');if(k==='valley')a.push('山谷与山顶温差明显');if(k==='lake')a.push('湖面风感可能偏强');if((w.rp||0)>=40)a.push('带防水层');return a.join(' · ')||'以临近预报为准'}
function fit(){let a=$('#app');a.style.transform='none';a.style.width='100%';let h=Math.max(260,innerHeight-3),n=a.scrollHeight,s=Math.min(1,h/n);if(s<.84)s=.84;if(s<.995){a.style.transform=`scale(${s})`;a.style.width=100/s+'%'}document.body.style.overflow=n*s>h+2?'auto':'hidden'}function later(){requestAnimationFrame(()=>requestAnimationFrame(fit))}
async function overview(){let items=Object.entries(R).map(([date,r])=>({date,id:r[2]})),z=await Promise.allSettled(items.map(async o=>({...o,w:x(await load(o.id),o.date)}))),rows=z.map((q,i)=>q.status==='fulfilled'?q.value:{...items[i],w:null}),v=rows.filter(r=>r.w);if(!v.length){$('#root').innerHTML='<div class="notice">日期尚未进入未来 16 天预报范围；临近后会自动显示。</div>';return}let H=Math.max(...v.map(r=>r.w.hi)),L=Math.min(...v.map(r=>r.w.lo)),RP=Math.max(...v.map(r=>r.w.rp||0)),G=Math.max(...v.map(r=>r.w.g||0)),strip=rows.map(r=>{let w=r.w,i=w?wi(w.code):['⏳','待更新'];return`<div class="day"><div class="date">${r.date.slice(5).replace('-','/')}</div><div class="icon">${i[0]}</div><div class="temp">${w?f(w.hi)+'° / '+f(w.lo)+'°':'—'}</div><div class="rain">${w?f(w.rp)+'%':'待更新'}</div><div class="place">${e(P[r.id][0])}</div></div>`}).join('');$('#root').innerHTML=`<div class="metrics"><div class="metric"><span class="muted">最高温</span><b>${f(H)}°C</b></div><div class="metric"><span class="muted">最低温</span><b>${f(L)}°C</b></div><div class="metric"><span class="muted">最高降雨概率</span><b>${f(RP)}%</b></div><div class="metric"><span class="muted">最大阵风</span><b>${f(G,1)} m/s</b></div></div><div class="strip">${strip}</div><div class="pack"><b>🧳 打包建议</b><div class="chips">${tips(v).map(t=>`<span class="chip">${e(t)}</span>`).join('')}</div></div>`}
async function day(date,r){let z=await Promise.allSettled(r[3].map(async id=>({id,w:x(await load(id),date)}))),rows=z.map((q,i)=>q.status==='fulfilled'?q.value:{id:r[3][i],w:null}),v=rows.filter(r=>r.w),cmp='当天主要地点的最新预报。';if(v.length>1)cmp=`沿途约 ${f(Math.min(...v.map(x=>x.w.lo)))}–${f(Math.max(...v.map(x=>x.w.hi)))}°C，最高降雨概率 ${f(Math.max(...v.map(x=>x.w.rp||0)))}%。`;let cards=rows.map(o=>{let p=P[o.id],w=o.w;if(!w)return`<div class="card"><div class="name">${e(p[0])}</div><div class="note">暂不在未来 16 天范围</div></div>`;let i=wi(w.code);return`<div class="card"><div class="ct"><div><div class="name">${e(p[0])}</div><div class="elev">海拔约 ${p[3]} m</div></div><div><div class="icon">${i[0]}</div><div class="elev">${i[1]}</div></div></div><div class="big">${f(w.hi)}° <span class="low">/ ${f(w.lo)}°C</span></div><div class="facts"><div class="fact"><div class="fk">体感高 / 低</div><div class="fv">${f(w.ahi)}° / ${f(w.alo)}°</div></div><div class="fact"><div class="fk">降雨</div><div class="fv">${f(w.rp)}% · ${f(w.mm,1)} mm</div></div><div class="fact"><div class="fk">风 / 阵风</div><div class="fv">${f(w.w,1)} / ${f(w.g,1)} m/s</div></div><div class="fact"><div class="fk">UV</div><div class="fv">${f(w.uv,1)}</div></div></div><div class="note">${e(note(o.id,w))}</div></div>`}).join('');$('#root').innerHTML=`<div class="summary"><div><h2>${e(r[0])}｜${e(r[1])}</h2><div class="muted">${cmp}</div></div><span class="badge">${conf(date)}</span></div><div class="grid">${cards}</div><div class="pack"><b>🎒 当日装备</b><div class="chips">${tips(rows).map(t=>`<span class="chip">${e(t)}</span>`).join('')}</div></div>`}
async function render(){let q=new URLSearchParams(location.search),date=q.get('date'),mode=q.get('mode')||'overview';$('#status').textContent='更新中…';$('#refresh').disabled=true;try{if(mode==='day'&&R[date]){$('#title').textContent=R[date][0]+'天气';$('#sub').textContent=R[date][1]+' · °C · m/s · mm';await day(date,R[date])}else{await overview()}$('#status').textContent='已更新';$('#updated').textContent=new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date())}catch(err){$('#root').innerHTML='<div class="notice">暂时无法获取天气，请稍后刷新。</div>';$('#status').textContent='加载失败'}finally{$('#refresh').disabled=false;later()}}
$('#refresh').onclick=render;addEventListener('resize',later);render();setInterval(render,18e5);
</script></body></html>
