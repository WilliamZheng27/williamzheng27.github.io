  <style>

    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}body{padding:7px}.app{max-width:1120px;margin:auto;transform-origin:top left}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.title{font-size:15px;font-weight:730;line-height:1.25}.subtitle{font-size:10px;color:var(--muted);margin-top:2px}.actions{display:flex;align-items:center;gap:6px;flex:none}.button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:5px 8px;font-size:10px;cursor:pointer}.button:hover{background:var(--panel2)}.status{font-size:10px;color:var(--muted);white-space:nowrap}.notice{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:8px 10px;font-size:11px;line-height:1.45}.notice.error{border-color:#d45d5d;color:#b34444}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:5px 0 7px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 8px;box-shadow:var(--shadow)}.metric .k{font-size:9px;color:var(--muted)}.metric .v{font-size:17px;font-weight:730;margin-top:1px}.metric .s{font-size:9px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chart-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 8px;overflow:hidden;box-shadow:var(--shadow)}.chart-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:3px}.chart-title{font-size:11px;font-weight:690}.legend{display:flex;gap:7px;font-size:9px;color:var(--muted);flex-wrap:wrap}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px}.dot.high{background:var(--warm)}.dot.low{background:var(--cold)}.dot.rain{background:var(--rain)}svg{display:block;width:100%;height:auto}.pack{margin-top:7px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 8px}.pack-title{font-size:10px;font-weight:680;margin-bottom:4px}.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{font-size:9px;border-radius:999px;background:var(--panel2);padding:3px 6px;white-space:nowrap}.details{margin-top:7px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:10px}.details summary{cursor:pointer;padding:6px 8px;color:var(--muted);font-weight:650}.table-scroll{max-height:155px;overflow:auto;border-top:1px solid var(--line)}.overview-table{width:100%;border-collapse:collapse;font-size:9px}.overview-table th,.overview-table td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}.overview-table th{color:var(--muted);background:var(--panel2);font-weight:650;position:sticky;top:0}.overview-table tr:last-child td{border-bottom:none}.weather-cell{display:flex;align-items:center;gap:4px}.wx-icon{font-size:14px;line-height:1}.range{font-weight:650}.rain{color:var(--rain)}.confidence{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:1px 5px;font-size:8px;color:var(--muted)}.confidence.trend{color:var(--warn)}.day-summary{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 8px;margin-bottom:6px}.day-summary h2{font-size:12px;margin:0 0 2px}.day-summary p{font-size:9px;color:var(--muted);margin:0;line-height:1.35}.day-badge{font-size:8px;border:1px solid var(--line);border-radius:999px;padding:2px 5px;white-space:nowrap}.place-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.place{border:1px solid var(--line);border-radius:9px;padding:7px;background:var(--bg);box-shadow:var(--shadow);min-width:0}.place-top{display:flex;align-items:flex-start;justify-content:space-between;gap:5px}.place-name{font-size:10px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.place-meta{font-size:8px;color:var(--muted);margin-top:1px}.place-wx{text-align:right;flex:none}.place-wx .icon{font-size:17px;line-height:1}.place-wx .desc{font-size:8px;color:var(--muted);margin-top:1px}.temps{display:flex;align-items:baseline;gap:4px;margin:4px 0}.high-temp{font-size:17px;font-weight:740}.low-temp{font-size:11px;color:var(--muted)}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}.fact{background:var(--panel);border-radius:6px;padding:4px 5px;min-width:0}.fact .fk{font-size:7px;color:var(--muted);white-space:nowrap}.fact .fv{font-size:9px;font-weight:650;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.place-note{font-size:8px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px;padding-top:4px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footer{font-size:8px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:7px;flex-wrap:wrap}.footer a{color:inherit}.skeleton{height:95px;border-radius:9px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}@keyframes shimmer{to{background-position:-200% 0}}
    @media(max-width:520px){body{padding:5px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.place-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-title{font-size:10px}.legend{font-size:8px}.top{align-items:flex-start}.subtitle{display:none}}
  </style>

<body>
<div class="app" id="app">

  </div>

  <div class="footer"><span>数据：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · 越接近日期越可靠</span><span id="updated"></span></div>
</div>
<script>
'use strict';
const PLACES={
  hongkong:{name:'香港 HKG',lat:22.3193,lon:114.1694,elevation:10,kind:'city'},
  seatac:{name:'SeaTac / SEA',lat:47.4502,lon:-122.3088,elevation:132,kind:'city'},
  sammamish:{name:'Sammamish',lat:47.6163,lon:-122.0356,elevation:165,kind:'city'},
  snohomish:{name:'Twin Willow Gardens / Snohomish',lat:47.9129,lon:-122.0982,elevation:35,kind:'event'},
  bellevue:{name:'Bellevue',lat:47.6101,lon:-122.2015,elevation:26,kind:'city'},
  medina:{name:'Medina',lat:47.6209,lon:-122.2276,elevation:19,kind:'city'},
  uw:{name:'University of Washington',lat:47.6553,lon:-122.3035,elevation:35,kind:'city'},
  seattle:{name:'Seattle',lat:47.6062,lon:-122.3321,elevation:56,kind:'city'},
  enumclaw:{name:'Enumclaw',lat:47.2043,lon:-121.9915,elevation:232,kind:'city'},

  reflection:{name:'Reflection Lakes',lat:46.769519,lon:-121.729990,elevation:1481,kind:'mountain'},
  paradise:{name:'Paradise / Jackson Visitor Center',lat:46.785887,lon:-121.736573,elevation:1653,kind:'mountain'},
  myrtle:{name:'Myrtle Falls',lat:46.79122,lon:-121.73234,elevation:1681,kind:'mountain'},
  olympia:{name:'Olympia',lat:47.0379,lon:-122.9007,elevation:29,kind:'city'},
  quinault:{name:'Lake Quinault',lat:47.46695,lon:-123.84829,elevation:64,kind:'forest'},
  ruby:{name:'Ruby Beach',lat:47.7108,lon:-124.4156,elevation:5,kind:'coast'},
  hoh:{name:'Hoh Rain Forest',lat:47.8609,lon:-123.9348,elevation:175,kind:'forest'},
  forks:{name:'Forks',lat:47.9504,lon:-124.3855,elevation:91,kind:'city'},
  crescent:{name:'Lake Crescent',lat:48.0570,lon:-123.7908,elevation:178,kind:'lake'},
  marymere:{name:'Marymere Falls',lat:48.0562,lon:-123.7878,elevation:210,kind:'forest'},

  desmoines:{name:'Des Moines / SEA 附近',lat:47.4018,lon:-122.3243,elevation:28,kind:'city'}
};
const ROUTE={
  '2026-08-26':{label:'8 月 26 日（周三）',title:'香港出发',primary:'hongkong',places:['hongkong']},
  '2026-08-27':{label:'8 月 27 日（周四）',title:'抵达与 Twin Willow Gardens',primary:'snohomish',places:['seatac','sammamish','snohomish']},
  '2026-08-28':{label:'8 月 28 日（周五）',title:'Bellevue、Medina 与 UW',primary:'bellevue',places:['bellevue','medina','uw']},
  '2026-08-29':{label:'8 月 29 日（周六）',title:'婚礼日',primary:'snohomish',places:['snohomish']},
  '2026-08-30':{label:'8 月 30 日（周日）',title:'西雅图市区',primary:'seattle',places:['seattle']},
  '2026-08-31':{label:'8 月 31 日（周一）',title:'雷尼尔山 → Olympia',primary:'paradise',places:['enumclaw','sunrise','reflection','paradise','myrtle','olympia']},
  '2026-09-01':{label:'9 月 1 日（周二）',title:'Olympia → Olympic Peninsula → Forks',primary:'hoh',places:['olympia','quinault','ruby','hoh','forks']},
  '2026-09-02':{label:'9 月 2 日（周三）',title:'Forks → Hurricane Ridge → SEA 附近',primary:'hurricane',places:['forks','crescent','marymere','portangeles','hurricane','desmoines']},
  '2026-09-03':{label:'9 月 3 日（周四）',title:'返程',primary:'seatac',places:['seatac']}
};
const DAILY=['weather_code','temperature_2m_max','temperature_2m_min','apparent_temperature_max','apparent_temperature_min','precipitation_sum','precipitation_probability_max','wind_speed_10m_max','wind_gusts_10m_max','uv_index_max'];
const CACHE_MS=30*60*1000;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const fmt=(n,d=0)=>Number.isFinite(Number(n))?Number(n).toFixed(d):'—';
function weatherInfo(code){const c=Number(code);if(c===0)return['☀️','晴朗'];if([1,2].includes(c))return['🌤️','晴间多云'];if(c===3)return['☁️','阴'];if([45,48].includes(c))return['🌫️','雾'];if([51,53,55,56,57].includes(c))return['🌦️','毛毛雨'];if([61,63,65,66,67].includes(c))return['🌧️','降雨'];if([71,73,75,77,85,86].includes(c))return['🌨️','降雪'];if([80,81,82].includes(c))return['🌦️','阵雨'];if([95,96,99].includes(c))return['⛈️','雷暴'];return['🌡️','天气变化'];}
function isoToday(tz='America/Los_Angeles'){const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o=Object.fromEntries(parts.map(p=>[p.type,p.value]));return `${o.year}-${o.month}-${o.day}`;}
function dayDiff(a,b){return Math.round((Date.parse(a+'T12:00:00Z')-Date.parse(b+'T12:00:00Z'))/86400000);}
function confidence(date){const d=dayDiff(date,isoToday());if(d<=5)return['较高',''];if(d<=10)return['中等',''];return['长期趋势','trend'];}
function apiUrl(p){const q=new URLSearchParams({latitude:p.lat,longitude:p.lon,elevation:p.elevation,daily:DAILY.join(','),temperature_unit:'celsius',wind_speed_unit:'ms',precipitation_unit:'mm',timezone:'auto',forecast_days:'16'});return `https://api.open-meteo.com/v1/forecast?${q}`;}
async function fetchJson(url,ms=12000){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);try{const r=await fetch(url,{signal:ctl.signal,cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.json();}finally{clearTimeout(t);}}
async function loadPlace(id,force=false){const p=PLACES[id],key=`tripwx-v4:${p.lat}:${p.lon}:${p.elevation}`;if(!force){try{const c=JSON.parse(localStorage.getItem(key));if(c&&Date.now()-c.at<CACHE_MS)return c.data;}catch(_){}}const data=await fetchJson(apiUrl(p));try{localStorage.setItem(key,JSON.stringify({at:Date.now(),data}));}catch(_){}return data;}
function extract(data,date){const i=data?.daily?.time?.indexOf(date);if(i==null||i<0)return null;const d=data.daily;return{code:d.weather_code?.[i],high:d.temperature_2m_max?.[i],low:d.temperature_2m_min?.[i],feelsHigh:d.apparent_temperature_max?.[i],feelsLow:d.apparent_temperature_min?.[i],precip:d.precipitation_sum?.[i],rainProb:d.precipitation_probability_max?.[i],wind:d.wind_speed_10m_max?.[i],gust:d.wind_gusts_10m_max?.[i],uv:d.uv_index_max?.[i]};}
function packingFrom(rows){const vals=rows.map(r=>r.wx).filter(Boolean);if(!vals.length)return['临近日期后再确认预报'];const min=Math.min(...vals.map(v=>v.low));const max=Math.max(...vals.map(v=>v.high));const rain=Math.max(...vals.map(v=>v.rainProb??0));const precip=Math.max(...vals.map(v=>v.precip??0));const gust=Math.max(...vals.map(v=>v.gust??0));const uv=Math.max(...vals.map(v=>v.uv??0));const chips=['分层穿衣'];if(min<=5)chips.push('保暖中层＋帽子');else if(min<=11)chips.push('薄抓绒/针织外套');if(max>=27)chips.push('轻薄透气衣物');if(rain>=35||precip>=1)chips.push('防水外套/折叠伞');if(rain>=60||precip>=5)chips.push('备用袜子');if(gust>=12)chips.push('防风层');if(uv>=5)chips.push('防晒霜＋太阳镜');if(rows.some(r=>PLACES[r.id]?.kind==='mountain'))chips.push('高海拔温差装备');if(rows.some(r=>['forest','lake','coast','mountain'].includes(PLACES[r.id]?.kind)))chips.push('防滑徒步鞋');return [...new Set(chips)];}
function placeNote(p,wx){const n=[];if(p.kind==='mountain')n.push('高海拔温差与风变化快');if(p.kind==='coast')n.push('海边风感较强');if(p.kind==='forest')n.push('林下路面可能潮湿');if((wx.rainProb??0)>=40)n.push('带防水层');if((wx.gust??0)>=12)n.push('阵风偏强');if((wx.uv??0)>=5)n.push('注意防晒');return n.join(' · ')||'以临近预报为准';}
function fitToFrame(){const app=$('#app');if(!app)return;app.style.transform='none';app.style.width='100%';const available=Math.max(260,window.innerHeight-4);const needed=app.scrollHeight;let scale=Math.min(1,available/needed);if(scale<.84)scale=.84;if(scale<.995){app.style.transform=`scale(${scale})`;app.style.width=`${100/scale}%`;}document.body.style.overflow=needed*scale>available+2?'auto':'hidden';}
function scheduleFit(){requestAnimationFrame(()=>requestAnimationFrame(fitToFrame));}
function renderOverview(rows){const valid=rows.filter(r=>r.wx);if(!valid.length)throw new Error('行程日期尚未进入 16 天预报窗口');const highs=valid.map(r=>r.wx.high),lows=valid.map(r=>r.wx.low),rain=valid.map(r=>r.wx.rainProb??0),gust=valid.map(r=>r.wx.gust??0);const maxHigh=Math.max(...highs),minLow=Math.min(...lows),maxRain=Math.max(...rain),maxGust=Math.max(...gust);const maxHighRow=valid[highs.indexOf(maxHigh)],minLowRow=valid[lows.indexOf(minLow)],maxRainRow=valid[rain.indexOf(maxRain)],maxGustRow=valid[gust.indexOf(maxGust)];const chips=packingFrom(valid);
  const W=900,H=205,pad={l:36,r:14,t:19,b:36};const yMin=Math.floor(minLow-3),yMax=Math.ceil(maxHigh+3),x=i=>pad.l+i*((W-pad.l-pad.r)/Math.max(1,valid.length-1)),y=t=>pad.t+(yMax-t)*(H-pad.t-pad.b)/(yMax-yMin);const rainH=p=>Math.max(0,(p/100)*(H-pad.t-pad.b)*.28);const highPts=valid.map((r,i)=>`${x(i)},${y(r.wx.high)}`).join(' '),lowPts=valid.map((r,i)=>`${x(i)},${y(r.wx.low)}`).join(' ');let grid='';for(let t=Math.ceil(yMin/5)*5;t<=yMax;t+=5)grid+=`<line x1="${pad.l}" y1="${y(t)}" x2="${W-pad.r}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pad.l-5}" y="${y(t)+3}" text-anchor="end" font-size="8" fill="var(--muted)">${t}°</text>`;const bars=valid.map((r,i)=>{const bw=Math.min(28,(W-pad.l-pad.r)/valid.length*.42),h=rainH(r.wx.rainProb??0);return `<rect x="${x(i)-bw/2}" y="${H-pad.b-h}" width="${bw}" height="${h}" rx="3" fill="var(--rain)" opacity=".25"/><text x="${x(i)}" y="${H-pad.b-h-3}" text-anchor="middle" font-size="7" fill="var(--rain)">${fmt(r.wx.rainProb)}%</text>`}).join('');const points=valid.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.wx.high)}" r="3" fill="var(--warm)"/><circle cx="${x(i)}" cy="${y(r.wx.low)}" r="3" fill="var(--cold)"/><text x="${x(i)}" y="${y(r.wx.high)-6}" text-anchor="middle" font-size="8" font-weight="650" fill="var(--warm)">${fmt(r.wx.high)}°</text><text x="${x(i)}" y="${y(r.wx.low)+12}" text-anchor="middle" font-size="8" font-weight="650" fill="var(--cold)">${fmt(r.wx.low)}°</text><text x="${x(i)}" y="${H-18}" text-anchor="middle" font-size="8" fill="var(--text)">${r.date.slice(5).replace('-','/')}</text>`).join('');
  const table=rows.map(r=>{const c=confidence(r.date),w=r.wx,info=w?weatherInfo(w.code):['⏳','暂不可用'];return `<tr><td>${r.date.slice(5).replace('-','/')}</td><td>${esc(PLACES[r.id].name)}</td><td><span class="weather-cell"><span class="wx-icon">${info[0]}</span><span>${info[1]}</span></span></td><td class="range">${w?`${fmt(w.high)}° / ${fmt(w.low)}°`:'—'}</td><td class="rain">${w?`${fmt(w.rainProb)}% · ${fmt(w.precip,1)} mm`:'—'}</td><td>${w?`${fmt(w.wind,1)} / ${fmt(w.gust,1)} m/s`:'—'}</td><td><span class="confidence ${c[1]}">${c[0]}</span></td></tr>`}).join('');
  $('#content').innerHTML=`<div class="metrics"><div class="metric"><div class="k">全程最高温</div><div class="v">${fmt(maxHigh)}°C</div><div class="s">${maxHighRow.date.slice(5).replace('-','/')} · ${esc(PLACES[maxHighRow.id].name)}</div></div><div class="metric"><div class="k">全程最低温</div><div class="v">${fmt(minLow)}°C</div><div class="s">${minLowRow.date.slice(5).replace('-','/')} · ${esc(PLACES[minLowRow.id].name)}</div></div><div class="metric"><div class="k">最高降雨概率</div><div class="v">${fmt(maxRain)}%</div><div class="s">${maxRainRow.date.slice(5).replace('-','/')} · ${esc(PLACES[maxRainRow.id].name)}</div></div><div class="metric"><div class="k">最大阵风</div><div class="v">${fmt(maxGust,1)} m/s</div><div class="s">${maxGustRow.date.slice(5).replace('-','/')} · ${esc(PLACES[maxGustRow.id].name)}</div></div></div><div class="chart-wrap"><div class="chart-head"><div class="chart-title">8/26–9/3 温度与降雨趋势</div><div class="legend"><span><i class="dot high"></i>最高温</span><span><i class="dot low"></i>最低温</span><span><i class="dot rain"></i>降雨概率</span></div></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="行程温度与降雨趋势图">${grid}${bars}<polyline points="${highPts}" fill="none" stroke="var(--warm)" stroke-width="2.2" stroke-linejoin="round"/><polyline points="${lowPts}" fill="none" stroke="var(--cold)" stroke-width="2.2" stroke-linejoin="round"/>${points}</svg></div><div class="pack"><div class="pack-title">🧳 打包建议</div><div class="chips">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div></div><details class="details"><summary>展开每日数值（可选）</summary><div class="table-scroll"><table class="overview-table"><thead><tr><th>日期</th><th>代表地点</th><th>天气</th><th>高 / 低</th><th>降雨</th><th>风 / 阵风</th><th>可信度</th></tr></thead><tbody>${table}</tbody></table></div></details>`;
  const details=$('.details');if(details)details.addEventListener('toggle',scheduleFit);scheduleFit();
}
function renderDay(date,route,rows){const c=confidence(date);const valid=rows.filter(r=>r.wx);const chips=packingFrom(rows);const card=rows.map(r=>{const p=PLACES[r.id],w=r.wx;if(!w)return `<div class="place"><div class="place-name">${esc(p.name)}</div><div class="place-note">暂不在 16 天预报范围内</div></div>`;const info=weatherInfo(w.code);return `<div class="place"><div class="place-top"><div><div class="place-name" title="${esc(p.name)}">${esc(p.name)}</div><div class="place-meta">海拔约 ${fmt(p.elevation)} m</div></div><div class="place-wx"><div class="icon">${info[0]}</div><div class="desc">${info[1]}</div></div></div><div class="temps"><span class="high-temp">${fmt(w.high)}°</span><span class="low-temp">/ ${fmt(w.low)}°C</span></div><div class="facts"><div class="fact"><div class="fk">体感高 / 低</div><div class="fv">${fmt(w.feelsHigh)}° / ${fmt(w.feelsLow)}°</div></div><div class="fact"><div class="fk">降雨</div><div class="fv">${fmt(w.rainProb)}% · ${fmt(w.precip,1)} mm</div></div><div class="fact"><div class="fk">风 / 阵风</div><div class="fv">${fmt(w.wind,1)} / ${fmt(w.gust,1)} m/s</div></div><div class="fact"><div class="fk">UV</div><div class="fv">${fmt(w.uv,1)}</div></div></div><div class="place-note" title="${esc(placeNote(p,w))}">${esc(placeNote(p,w))}</div></div>`}).join('');let compare='';if(valid.length>1){const min=Math.min(...valid.map(r=>r.wx.low)),max=Math.max(...valid.map(r=>r.wx.high)),rain=Math.max(...valid.map(r=>r.wx.rainProb??0));compare=`沿途约 ${fmt(min)}–${fmt(max)}°C，最高降雨概率 ${fmt(rain)}%；高海拔与海岸可能和城市差异明显。`;}
  $('#content').innerHTML=`<div class="day-summary"><div><h2>${esc(route.label)}｜${esc(route.title)}</h2><p>${esc(compare||'当天主要地点的最新预报。')}</p></div><span class="day-badge ${c[1]}">${c[0]}</span></div><div class="place-grid">${card}</div><div class="pack"><div class="pack-title">🎒 当日装备</div><div class="chips">${chips.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`;scheduleFit();
}
async function render(force=false){const q=new URLSearchParams(location.search),mode=q.get('mode')||'overview',date=q.get('date');$('#status').textContent='正在更新…';$('#refresh').disabled=true;try{if(mode==='day'&&date&&ROUTE[date]){const r=ROUTE[date];$('#title').textContent=`${r.label}天气`;$('#subtitle').textContent=`${r.title} · °C · m/s · mm`;const settled=await Promise.allSettled(r.places.map(async id=>({id,wx:extract(await loadPlace(id,force),date)})));const rows=settled.map((x,i)=>x.status==='fulfilled'?x.value:{id:r.places[i],wx:null});renderDay(date,r,rows);}else{$('#title').textContent='全程天气与打包';$('#subtitle').textContent='2026/8/26–9/3 · Open-Meteo 16 天预报 · °C · m/s · mm';const items=Object.entries(ROUTE).map(([d,r])=>({date:d,id:r.primary}));const settled=await Promise.allSettled(items.map(async x=>({...x,wx:extract(await loadPlace(x.id,force),x.date)})));const rows=settled.map((x,i)=>x.status==='fulfilled'?x.value:{...items[i],wx:null});renderOverview(rows);}const now=new Date();$('#status').textContent='已更新';$('#updated').textContent=`${new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(now)}`;scheduleFit();}catch(e){console.error(e);$('#status').textContent='加载失败';$('#content').innerHTML=`<div class="notice error"><strong>暂时无法获取天气。</strong><br>${esc(e?.message||e)}。请稍后点击“刷新”。</div>`;scheduleFit();}finally{$('#refresh').disabled=false;}}
$('#refresh').addEventListener('click',()=>render(true));window.addEventListener('resize',scheduleFit);if('ResizeObserver'in window)new ResizeObserver(scheduleFit).observe($('#app'));render(false);setInterval(()=>render(true),30*60*1000);
</script>
</body>
